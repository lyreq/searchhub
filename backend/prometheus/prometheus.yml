global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: app
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
  - job_name: redis-exporter
    static_configs:
      - targets: ["redis_exporter:9121"]
  - job_name: meilisearch
    static_configs:
      - targets: ["meilisearch:7700"]
        labels:
          env: "%{ENV}"
    authorization:
      type: Bearer
      credentials_file: ./meilisearch-credentials.yml
