app:
  url: ${APP_URL}
  port: ${APP_PORT}
  jwt_secret: ${APP_JWT_SECRET}
  admin_jwt_secret: ${APP_ADMIN_JWT_SECRET}
  auth_expire_hours: ${APP_AUTH_EXPIRE_HOURS}
  otp_expire_seconds: ${OTP_EXPIRE_SECONDS}
database:
  name: ${DB_NAME}
  host: ${DB_HOST}
  pass: ${DB_PASSWORD}
  user: ${DB_USER}
  port: ${DB_PORT}
  debug: ${DB_DEBUG}
  migrate: ${DB_MIGRATE}
redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}
  pass: ${REDIS_PASSWORD}
logar:
  admin_username: ${LOGAR_ADMIN_USERNAME}
  admin_password: ${LOGAR_ADMIN_PASSWORD}
provider:
  provider1: ${PROVIDER1_URL}
  provider2: ${PROVIDER2_URL}
